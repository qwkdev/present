<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Present</title>

	<style>
:root {
	--bg: #000;
	--cover: #00000277;
	--fg: #252527;
	--fg2: #353537;
	--fg3: #454547;
	--fg2h: #404042;
	--fg3h: #505052;
}
*[hidden] {
	display: none !important;
}
body {
	margin: 0;
	background: var(--bg);
	overflow: hidden;
}

dialog {
	position: absolute;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
	background: var(--cover);
}
#modal, #error {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);

	width: 40vh;
	height: max-content;
	box-sizing: border-box;
	padding: 1vh;
	background: var(--fg);
	border-radius: 1.5vh;
}
#error h1 {
	color: #fff;
	font-family: Arial;
	font-size: 2vh;
	
	margin: 2vh 0;
	font-weight: 500;

	width: 100%;
	text-align: center;
}
#modal {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 1vh .5vh;
}
#modal h1 {
	color: #fff;
	font-family: Arial;
	font-size: 2vh;
	grid-column: 1 / 3;
	margin: 0;
	margin-top: .1vh;
	font-weight: 500;
	width: 100%;
	text-align: center;
}
#modal button, #modal a {
	position: relative;
	width: 100%;
	height: 20vh;
	box-sizing: border-box;
	background: var(--fg2);
	border: .1vh solid var(--fg3);
	border-radius: .75vh;
	transition: .2s;
}
#modal button:focus, #modal a:focus {
	outline: none;
}
#modal button:hover, #modal a:hover {
	background: var(--fg2h);
	border-color: var(--fg3h);
	transform: scale(1.02);
}
#modal button:active, #modal a:active {
	transform: scale(0.98) !important;
}
#modal button p, #modal a p {
	color: #ccc;
	font-family: Arial;
	font-size: 1.2vh;
	position: absolute;
	bottom: 0;
	left: 0;
	width: 100%;
	text-align: center;
	margin: 0;
	margin-bottom: .5vh;
}
#modal button svg, #modal a svg {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	stroke: #ccc;
	stroke-width: 1.5px;
}
#modal *::selection {
	background: #fff7;
}
#images {
	--s: 0;
	display: flex;
	align-items: center;
	user-select: none;
	height: 100vh;
	height: 100dvh;
	transform: translateX(calc(-100vw * var(--s)));
	transition: .5s;
}
#images img {
	height: 100%;
	width: 100vw;
	flex-shrink: 0;
	object-fit: contain;
	user-select: none;
}
#end {
	--i: 1;
	user-select: none;
	flex-shrink: 0;
	width: 100vw;
	height: 100vh;
	height: 100dvh;
	display: grid;
	grid-template-columns: repeat(
	auto-fit, minmax(min(calc(1600vh/(9*var(--i))), 100%), 1fr)
	);
	grid-auto-rows: minmax(0, min-content);
}
#end img {
	width: 100%;
	max-height: 100%;
	object-fit: contain;
	user-select: none;
}
	</style>
</head>
<body>
	<dialog id="menu">
		<div id="modal">
			<h1>Presenting: <span id="name"></span></h1>			
			<a id="download" download>
				<svg style="width: 50%;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M12 9.5V15.5M12 15.5L10 13.5M12 15.5L14 13.5M8.4 19C5.41766 19 3 16.6044 3 13.6493C3 11.2001 4.8 8.9375 7.5 8.5C8.34694 6.48637 10.3514 5 12.6893 5C15.684 5 18.1317 7.32251 18.3 10.25C19.8893 10.9449 21 12.6503 21 14.4969C21 16.9839 18.9853 19 16.5 19L8.4 19Z" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
				<p>Download Scratch</p>
			</a>
			<button onclick="start()">
				<svg style="width: 45%; left: 51%;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M16.6582 9.28638C18.098 10.1862 18.8178 10.6361 19.0647 11.2122C19.2803 11.7152 19.2803 12.2847 19.0647 12.7878C18.8178 13.3638 18.098 13.8137 16.6582 14.7136L9.896 18.94C8.29805 19.9387 7.49907 20.4381 6.83973 20.385C6.26501 20.3388 5.73818 20.0469 5.3944 19.584C5 19.053 5 18.1108 5 16.2264V7.77357C5 5.88919 5 4.94701 5.3944 4.41598C5.73818 3.9531 6.26501 3.66111 6.83973 3.6149C7.49907 3.5619 8.29805 4.06126 9.896 5.05998L16.6582 9.28638Z" stroke-linejoin="round"></path></g></svg>
				<p>Start</p>
			</button>
		</div>
		<div id="error" hidden>
			<h1>Couldn't find presentation</h1>
		</div>
	</dialog>
	<main id="images" style="--s: 0;"></main>
	<div id="end"></div>
	<script>
		const data = {
			catch: 3,
		};

		let presenting = false;
		const menu = document.getElementById('menu');

		const query = window.location.search.slice(1);
		const images = document.getElementById('images');
		const valid = Object.keys(data).includes(query);
		if (!valid) {
			document.getElementById('modal').hidden = true;
			document.getElementById('error').hidden = false;
		} else {
			document.getElementById('download').href = `/${query}/p.sb3`;

			const inner = Array.from({ length: data[query] },
				(_,i) => `<img src="/${query}/Slide${i+1}.jpg">`
			).join('');
			images.innerHTML = inner + `<div id="end" style="--i: ${data[query]};">${inner}</div>`;
			document.getElementById('name').textContent = query.slice(0, 1).toUpperCase() + query.slice(1);
		}
		menu.showModal();

		function start() {
			menu.close();
			presenting = true;
			document.body.requestFullscreen();
		}

		let current = 0;
		function slide(dir) {
			if (!valid || current + dir < 0 || current + dir > data[query]) return
			current += dir;
			images.style.setProperty('--s', current);
		}

		document.addEventListener('keydown', e => {
			if (!presenting) return;
			if (['ArrowLeft', 'a', 'Backspace'].includes(e.key)) slide(-1);
			else if (['ArrowRight', 'd', ' ', 'Enter'].includes(e.key)) slide(1);
		});
		document.addEventListener('mousedown', e => {
			if (!presenting) return;
			const x = e.clientX / window.innerWidth;
			if (.4 < x && x < .6) return;
			slide(x >= .5 ? 1 : -1);
		});
	</script>
</body>
</html>
