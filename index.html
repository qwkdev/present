<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

	<style>
:root {
	--u: 1.5vw;
	--bg: #111;
	--fg: #fff;
	--border: #fff2;
	--text: #000;
}
body {
	margin: calc(3 * var(--u)) auto;
	overflow-x: hidden;
	scrollbar-width: none;

	background: var(--bg);
	padding: 0 calc(3 * var(--u));
	max-width: calc(90 * var(--u));
	box-sizing: border-box;

	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(25vh, 100%), 1fr));
	gap: calc(1 * var(--u));
}
body::-webkit-scrollbar {
	display: none;
}

a {
	background: var(--fg);
	border-radius: calc(2 * var(--u));
	display: block;
	width: 100%;
	box-sizing: border-box;
	padding: calc(1 * var(--u));
	margin-top: calc(2 * var(--u));
	text-decoration: none;
	color: var(--text);
	font-family: Arial;

	img {
		width: 100%;
		padding: 0 calc(-1 * var(--u));
		margin-top: calc(-2 * var(--u));
		border-radius: calc(2 * var(--u));
	}
	button {
		width: 100%;
		box-sizing: border-box;
		margin: 0 calc(1 * var(--u));
		border-radius: calc(1 * var(--u));
	}
}

@media screen and (min-aspect-ratio: 2/3) {
	:root {
		--u: 1vh;
	}
}
	</style>
</head>
