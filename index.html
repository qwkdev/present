<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

	<style>
:root {
	--u: 1.5vw;
	--bg: #111;
	--fg: #fff;
	--border: #000;
	--text: #000;
}
body {
	margin: calc(3 * var(--u)) auto;
	overflow-x: hidden;
	scrollbar-width: none;

	background: var(--bg);
	padding: 0 calc(3 * var(--u));
	max-width: calc(90 * var(--u));
	box-sizing: border-box;
}
body::-webkit-scrollbar {
	display: none;
}

#links {
	width: 100%;
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(min(25vh, 100%), 1fr));
	gap: calc(1 * var(--u));
}
#links a {
	background: var(--fg);
	border-radius: calc(2 * var(--u));
	display: block;
	width: 100%;
	box-sizing: border-box;
	padding-bottom: calc(1.4 * var(--u));
	margin-top: calc(2 * var(--u));
	text-decoration: none;
	color: var(--text);
	font-family: Arial;
	transition: .2s;
}
#links a:hover {
	transform: scale(1.02);
}
#links a:active {
	transform: scale(0.98);
}
#links a img {
	width: 100%;
	aspect-ratio: 1/1;
	padding: 0 calc(-1 * var(--u));
	margin-top: calc(-2 * var(--u));
	border-radius: calc(2 * var(--u));
}
#links a h2 {
	margin: calc(.5 * var(--u)) calc(1.5 * var(--u));
	font-size: calc(3 * var(--u));
}
#links a p {
	margin: 0 calc(1.5 * var(--u));
	font-size: calc(2 * var(--u));
}
#links a button {
	width: calc(100% - 3 * var(--u));
	box-sizing: border-box;
	margin: 0 calc(1.5 * var(--u));
	margin-top: calc(1.5 * var(--u));
	height: calc(4 * var(--u));
	font-size: calc(2 * var(--u));
	border-radius: calc(1 * var(--u));
	border: calc(.1 * var(--u)) solid var(--border);
	box-shadow: 0 0 calc(1 * var(--u)) #0027;
	background: var(--fg);
	transition: .2s;
}
#links a button:hover {
	transform: scale(1.02, 1.025);
}

@media screen and (min-aspect-ratio: 2/3) {
	:root {
		--u: 1vh;
	}
}
	</style>
</head>
<body>
	<div id="links"></div>
	<script>
		const links = document.getElementById('links');
		fetch('/data.json').then(d => d.json()).then(r => {
			links.innerHTML = '';
			for (const [k, v] of Object.entries(r)) {
				const a = document.createElement('a');
				a.href = `/task?${k}`;
				a.innerHTML = [
					`<img src="/${k}/t.jpg">`,
					`<h2>${v[1]}</h2>`,
					`<p>${v[2]}</p>`,
					'<button>View Presentation</button>'
				].join('');
				links.appendChild(a);
			}
	    });
	</script>
</body>
</html>
